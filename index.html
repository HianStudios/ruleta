<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>¿Qué Negocio Toca Hoy?</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060614;
  --surface: #0f0f28;
  --surface2: #161635;
  --border: #1e1e48;
  --accent: #7c3aed;
  --accent2: #a855f7;
  --gold: #fbbf24;
  --text: #e2e8f0;
  --muted: #64748b;
  --danger: #ef4444;
  --radius: 14px;
  --sidebar-w: 270px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ── SIDEBAR ───────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  gap: 12px;
  overflow-y: auto;
  transition: transform .3s ease;
  z-index: 100;
}

#sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
#sidebar-header h2 {
  font-size: .72rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: .12em;
  text-transform: uppercase;
}

#add-row {
  display: flex;
  gap: 7px;
}
#new-item {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 9px 11px;
  font-size: .82rem;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
}
#new-item:focus { border-color: var(--accent2); }
#new-item::placeholder { color: var(--muted); }

#btn-add {
  background: var(--accent);
  border: none;
  color: #fff;
  font-size: 1.3rem;
  border-radius: 10px;
  width: 40px;
  cursor: pointer;
  transition: background .2s, transform .1s;
  flex-shrink: 0;
}
#btn-add:hover { background: var(--accent2); transform: scale(1.05); }

#list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
  overflow-y: auto;
}

.item-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface2);
  border-radius: 10px;
  padding: 8px 10px;
  border-left: 3px solid;
  transition: opacity .2s;
}
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.name { flex: 1; font-size: .75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.del {
  background: none; border: none; color: var(--muted);
  font-size: .85rem; cursor: pointer; padding: 2px 4px;
  border-radius: 5px; transition: color .2s, background .2s;
  flex-shrink: 0;
}
.del:hover { color: var(--danger); background: rgba(239,68,68,.1); }

#count-badge {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: .68rem;
  color: var(--muted);
  text-align: center;
}

/* ── MAIN ──────────────────────────────────── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  background: radial-gradient(ellipse 70% 60% at 50% 40%, #1a0a3a 0%, var(--bg) 75%);
  position: relative;
  overflow: hidden;
  min-height: 100vh;
}

/* stars bg */
#main::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.5) 0%, transparent 100%),
    radial-gradient(1px 1px at 65% 18%, rgba(255,255,255,.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,.25) 0%, transparent 100%),
    radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,.3) 0%, transparent 100%);
  pointer-events: none;
}

#title {
  font-size: clamp(1.1rem, 3.5vw, 1.9rem);
  font-weight: 800;
  letter-spacing: .04em;
  margin-bottom: clamp(14px, 3vh, 28px);
  text-align: center;
  line-height: 1.2;
}
#title em {
  font-style: normal;
  color: var(--gold);
}

/* ── WHEEL ─────────────────────────────────── */
#wheel-wrap {
  position: relative;
  width: min(420px, 82vw, 68vh);
  height: min(420px, 82vw, 68vh);
}

#glow-ring {
  position: absolute;
  top: -14px; left: -14px; right: -14px; bottom: -14px;
  border-radius: 50%;
  border: 4px solid var(--accent2);
  box-shadow: 0 0 25px var(--accent), 0 0 55px rgba(124,58,237,.3);
  pointer-events: none;
  z-index: 2;
}

canvas {
  border-radius: 50%;
  display: block;
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
}

#hub {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 52px; height: 52px;
  background: radial-gradient(circle at 40% 35%, #2d2d6a, #0b0b20);
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
  z-index: 15;
  box-shadow: 0 4px 20px rgba(0,0,0,.6);
}

#pointer {
  position: absolute;
  top: -22px; left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  filter: drop-shadow(0 0 8px #ef4444);
}

/* LEDs */
.led {
  position: absolute;
  width: 7px; height: 7px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 0 5px #fff, 0 0 10px var(--accent2);
  z-index: 3;
  animation: blinkLed 1.8s ease-in-out infinite;
}
@keyframes blinkLed { 0%,100%{opacity:1} 50%{opacity:.15} }

/* ── SPIN BUTTON ────────────────────────────── */
#btn-spin {
  margin-top: clamp(16px, 3vh, 28px);
  padding: 13px 48px;
  font-size: clamp(.9rem, 2.5vw, 1.05rem);
  font-weight: 800;
  letter-spacing: .1em;
  font-family: inherit;
  background: linear-gradient(135deg, var(--accent), #5b21b6);
  border: none;
  border-radius: 50px;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 0 22px rgba(124,58,237,.5), 0 4px 18px rgba(0,0,0,.4);
  transition: transform .15s, box-shadow .15s;
}
#btn-spin:hover:not(:disabled) {
  transform: scale(1.05);
  box-shadow: 0 0 38px rgba(124,58,237,.75), 0 4px 22px rgba(0,0,0,.5);
}
#btn-spin:disabled {
  background: var(--surface2);
  box-shadow: none;
  cursor: not-allowed;
  color: var(--muted);
}

/* ── OVERLAY ────────────────────────────────── */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(6,6,20,.9);
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 20px;
  backdrop-filter: blur(4px);
}
#overlay.show { display: flex; animation: fadeIn .2s ease; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

#card {
  background: var(--surface);
  border: 2px solid var(--accent2);
  border-radius: 24px;
  padding: clamp(28px, 5vw, 48px) clamp(24px, 6vw, 56px);
  text-align: center;
  box-shadow: 0 0 50px rgba(124,58,237,.35), 0 0 100px rgba(124,58,237,.15);
  animation: popUp .45s cubic-bezier(.175,.885,.32,1.5) both;
  max-width: 440px;
  width: 100%;
}
@keyframes popUp { from{transform:scale(.15) rotate(-6deg);opacity:0} to{transform:scale(1);opacity:1} }

#res-emoji { font-size: clamp(3rem, 10vw, 4.5rem); margin-bottom: 8px; display: block; }
#res-label {
  font-size: clamp(1.2rem, 4vw, 2rem);
  font-weight: 800;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(251,191,36,.4);
  margin-bottom: 8px;
  line-height: 1.15;
}
#res-sub { color: var(--muted); font-size: .82rem; margin-bottom: 26px; }

.card-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
#btn-close {
  background: none;
  border: 1.5px solid var(--border);
  color: var(--muted);
  padding: 10px 24px;
  border-radius: 50px;
  cursor: pointer;
  font-weight: 700;
  font-size: .85rem;
  font-family: inherit;
  transition: border-color .2s, color .2s;
}
#btn-close:hover { border-color: var(--accent2); color: var(--accent2); }

#btn-again {
  background: linear-gradient(135deg, var(--accent), #5b21b6);
  border: none; color: #fff;
  padding: 10px 24px;
  border-radius: 50px;
  cursor: pointer;
  font-weight: 700;
  font-size: .85rem;
  font-family: inherit;
  box-shadow: 0 0 14px rgba(124,58,237,.4);
  transition: transform .15s, box-shadow .15s;
}
#btn-again:hover { transform: scale(1.04); }

/* ── MOBILE TOGGLE ──────────────────────────── */
#menu-toggle {
  display: none;
  position: fixed;
  top: 14px; left: 14px;
  z-index: 200;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  width: 42px; height: 42px;
  border-radius: 12px;
  font-size: 1.2rem;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 12px rgba(0,0,0,.4);
  transition: background .2s;
}
#menu-toggle:hover { background: var(--surface2); }

#overlay-sidebar {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 90;
  backdrop-filter: blur(2px);
}

/* ── RESPONSIVE ─────────────────────────────── */
@media (max-width: 680px) {
  body { overflow-y: auto; }

  #menu-toggle { display: flex; }
  #overlay-sidebar { display: none; }
  #overlay-sidebar.open { display: block; }

  #sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    transform: translateX(-110%);
    box-shadow: 4px 0 30px rgba(0,0,0,.5);
  }
  #sidebar.open { transform: translateX(0); }

  #main {
    min-height: 100svh;
    padding: 70px 16px 28px;
    justify-content: flex-start;
    padding-top: 80px;
  }

  #title {
    font-size: 1.05rem;
    margin-bottom: 16px;
  }

  #wheel-wrap {
    width: min(340px, 88vw);
    height: min(340px, 88vw);
  }

  #btn-spin {
    padding: 12px 38px;
    font-size: .88rem;
    margin-top: 18px;
  }
}

@media (max-width: 380px) {
  #wheel-wrap {
    width: 88vw;
    height: 88vw;
  }
}
</style>
</head>
<body>

<!-- mobile toggle -->
<button id="menu-toggle" aria-label="Abrir menú">☰</button>
<div id="overlay-sidebar"></div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div id="sidebar-header">
    <h2>Secciones</h2>
    <button id="btn-close-sidebar" style="background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;display:none">✕</button>
  </div>
  <div id="add-row">
    <input id="new-item" type="text" placeholder="Nueva sección…" maxlength="30" autocomplete="off">
    <button id="btn-add" aria-label="Agregar">+</button>
  </div>
  <div id="list"></div>
  <div id="count-badge">mín. 2 para girar</div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="title">¿QUÉ <em>NEGOCIO</em> TOCA HOY?</div>

  <div id="wheel-wrap">
    <div id="glow-ring"></div>
    <canvas id="canvas"></canvas>
    <div id="hub">🏪</div>
    <div id="pointer">
      <svg width="26" height="36" viewBox="0 0 26 36">
        <polygon points="13,34 1,3 25,3" fill="#ef4444"/>
        <polygon points="13,34 6,12 20,12" fill="#fca5a5" opacity=".5"/>
      </svg>
    </div>
  </div>

  <button id="btn-spin">↻ &nbsp;GIRAR</button>
</div>

<!-- RESULT OVERLAY -->
<div id="overlay">
  <div id="card">
    <span id="res-emoji">🎯</span>
    <div id="res-label">RESULTADO</div>
    <div id="res-sub">¡Este es tu negocio de hoy!</div>
    <div class="card-btns">
      <button id="btn-close">Cerrar</button>
      <button id="btn-again">Girar de nuevo</button>
    </div>
  </div>
</div>

<script>
// ── DATOS ─────────────────────────────────────────
const COLORS = [
  "#f59e0b","#ef4444","#ec4899","#8b5cf6","#6366f1","#3b82f6",
  "#06b6d4","#10b981","#84cc16","#f97316","#14b8a6","#a855f7",
  "#f43f5e","#eab308","#22c55e","#0ea5e9","#d946ef","#fb923c","#64748b","#e11d48"
];
const EMOJIS = ["🏋️","🍔","👗","💄","📷","🚗","🦷","🐾","🏠","💻","💼","🏗️","📱","🌿","🎨","🎵","💰","🎯","🔥","✨"];

let segments = [
  {label:"GIMNASIO Y FITNESS",            color:"#f59e0b", emoji:"🏋️"},
  {label:"RESTAURANTE Y COMIDA",          color:"#ef4444", emoji:"🍔"},
  {label:"TIENDA ONLINE DE ROPA",         color:"#ec4899", emoji:"👗"},
  {label:"SALÓN DE BELLEZA",              color:"#8b5cf6", emoji:"💄"},
  {label:"FOTOGRAFÍA",                    color:"#6366f1", emoji:"📷"},
  {label:"AUTOS / DETALLADO",             color:"#3b82f6", emoji:"🚗"},
  {label:"CLÍNICA DENTAL",               color:"#06b6d4", emoji:"🦷"},
  {label:"VETERINARIA",                   color:"#10b981", emoji:"🐾"},
  {label:"BIENES RAÍCES",               color:"#84cc16", emoji:"🏠"},
  {label:"SERVICIOS DIGITALES",           color:"#f97316", emoji:"💻"},
  {label:"ASESORÍA Y CONSULTORÍA",       color:"#14b8a6", emoji:"💼"},
  {label:"CONSTRUCCIÓN Y REMODELACIONES", color:"#a855f7", emoji:"🏗️"},
];

// ── CANVAS SETUP ───────────────────────────────────
const canvas = document.getElementById("canvas");
const ctx    = canvas.getContext("2d");
const wrapEl = document.getElementById("wheel-wrap");

function setCanvasSize() {
  const sz = wrapEl.offsetWidth;
  canvas.width  = sz;
  canvas.height = sz;
  buildLEDs();
  draw();
}

// ── LEDs ──────────────────────────────────────────
function buildLEDs() {
  wrapEl.querySelectorAll(".led").forEach(e => e.remove());
  const SZ = wrapEl.offsetWidth;
  const count = Math.floor(SZ / 16);
  const R = SZ / 2 + 11;
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 - Math.PI / 2;
    const led = document.createElement("div");
    led.className = "led";
    led.style.left = (SZ/2 + R * Math.cos(a) - 3.5) + "px";
    led.style.top  = (SZ/2 + R * Math.sin(a) - 3.5) + "px";
    led.style.animationDelay = (i * 0.065) + "s";
    wrapEl.appendChild(led);
  }
}

// ── DRAW ──────────────────────────────────────────
function wrapText(text, maxW) {
  const words = text.split(" ");
  const lines = [];
  let cur = "";
  for (const w of words) {
    const test = cur ? cur + " " + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

let angle    = 0;
let spinning = false;

function draw() {
  const W  = canvas.width;
  const cx = W/2, cy = W/2, r = W/2 - 3;
  ctx.clearRect(0, 0, W, W);

  if (!segments.length) {
    ctx.fillStyle = "#1a1a3a";
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = "#555";
    ctx.font = `bold ${Math.round(W*0.045)}px 'Space Grotesk', Arial`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Añade secciones", cx, cy);
    return;
  }

  const n   = segments.length;
  const arc = (Math.PI * 2) / n;

  for (let i = 0; i < n; i++) {
    const s   = angle + i * arc;
    const e   = s + arc;
    const seg = segments[i];

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, s, e);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,.3)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // shine
    const g = ctx.createRadialGradient(cx,cy,r*.05,cx,cy,r);
    g.addColorStop(0, "rgba(255,255,255,.18)");
    g.addColorStop(1, "rgba(0,0,0,.08)");
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,s,e); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();

    // text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(s + arc / 2);
    const fs   = Math.max(7, Math.min(12, W * 0.023));
    const tr   = r * 0.84;
    const maxW = tr * 0.54;
    ctx.font = `800 ${fs}px 'Space Grotesk', Arial`;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(0,0,0,.78)";
    const lines = wrapText(seg.label, maxW);
    const lh = fs * 1.25;
    const th = lines.length * lh;
    lines.forEach((ln, li) => { ctx.fillText(ln, tr, -th/2 + li*lh + lh/2); });

    // emoji
    ctx.font = `${Math.round(fs * 1.7)}px serif`;
    ctx.textAlign = "center";
    ctx.fillText(seg.emoji, r * 0.36, 0);
    ctx.restore();
  }

  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle = "rgba(255,255,255,.1)"; ctx.lineWidth = 2; ctx.stroke();
}

// ── SPIN ──────────────────────────────────────────
function spin() {
  if (spinning || segments.length < 2) return;
  spinning = true;
  const btn = document.getElementById("btn-spin");
  btn.disabled = true;
  btn.textContent = "GIRANDO…";

  const turns  = 7 + Math.random() * 5;
  const extra  = Math.random() * Math.PI * 2;
  const target = angle + turns * Math.PI * 2 + extra;
  const dur    = 4200 + Math.random() * 1800;
  const a0     = angle;
  const t0     = performance.now();
  const snap   = segments.slice();

  function ease(t) { return 1 - Math.pow(1 - t, 4); }

  function frame(now) {
    const t = Math.min((now - t0) / dur, 1);
    angle = a0 + (target - a0) * ease(t);
    draw();
    if (t < 1) { requestAnimationFrame(frame); }
    else {
      angle    = angle % (Math.PI * 2);
      spinning = false;
      btn.disabled = false;
      btn.innerHTML = "↻ &nbsp;GIRAR";
      showResult(snap, angle);
    }
  }
  requestAnimationFrame(frame);
}

// ── RESULT ────────────────────────────────────────
function showResult(segs, ang) {
  const n    = segs.length;
  const arc  = (Math.PI * 2) / n;
  const norm = ((ang % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  const ptr  = (Math.PI*2 - norm + Math.PI*1.5) % (Math.PI*2);
  const idx  = Math.floor(ptr / arc) % n;
  const w    = segs[idx];

  document.getElementById("res-emoji").textContent = w.emoji;
  document.getElementById("res-label").textContent = w.label;

  const card = document.getElementById("card");
  card.style.borderColor = w.color;
  card.style.boxShadow   = `0 0 50px ${w.color}55, 0 0 100px ${w.color}22`;
  card.style.animation   = "none";
  card.offsetHeight;
  card.style.animation   = "popUp .45s cubic-bezier(.175,.885,.32,1.5) both";

  document.getElementById("overlay").classList.add("show");
}

// ── LIST ──────────────────────────────────────────
function renderList() {
  const listEl = document.getElementById("list");
  listEl.innerHTML = "";
  const badge = document.getElementById("count-badge");
  badge.textContent = segments.length < 2
    ? "mín. 2 para girar"
    : `${segments.length} secciones`;

  if (!segments.length) {
    listEl.innerHTML = `<div style="color:var(--muted);font-size:.74rem;text-align:center;padding:12px 0">Sin secciones — ¡añade una!</div>`;
    return;
  }
  segments.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "item-row";
    row.style.borderLeftColor = s.color;
    row.innerHTML = `
      <div class="dot" style="background:${s.color}"></div>
      <div class="name">${s.emoji} ${s.label}</div>
      <button class="del" data-i="${i}" aria-label="Eliminar">✕</button>`;
    listEl.appendChild(row);
  });
  listEl.querySelectorAll(".del").forEach(b => {
    b.addEventListener("click", () => {
      segments.splice(+b.dataset.i, 1);
      renderList(); draw();
    });
  });
}

function addSeg() {
  const input = document.getElementById("new-item");
  const v     = input.value.trim().toUpperCase();
  if (!v) return;
  const idx = segments.length % COLORS.length;
  segments.push({ label: v, color: COLORS[idx], emoji: EMOJIS[idx] });
  input.value = "";
  renderList(); draw();
}

// ── MOBILE SIDEBAR ────────────────────────────────
function openSidebar() {
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("overlay-sidebar").classList.add("open");
  document.getElementById("btn-close-sidebar").style.display = "block";
}
function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay-sidebar").classList.remove("open");
}

document.getElementById("menu-toggle").addEventListener("click", openSidebar);
document.getElementById("overlay-sidebar").addEventListener("click", closeSidebar);
document.getElementById("btn-close-sidebar").addEventListener("click", closeSidebar);

// ── EVENTS ────────────────────────────────────────
document.getElementById("btn-spin").addEventListener("click", spin);
document.getElementById("btn-add").addEventListener("click", addSeg);
document.getElementById("new-item").addEventListener("keydown", e => { if (e.key === "Enter") addSeg(); });
document.getElementById("btn-close").addEventListener("click", () => document.getElementById("overlay").classList.remove("show"));
document.getElementById("btn-again").addEventListener("click", () => {
  document.getElementById("overlay").classList.remove("show");
  setTimeout(spin, 350);
});
document.getElementById("overlay").addEventListener("click", e => { if (e.target === document.getElementById("overlay")) document.getElementById("overlay").classList.remove("show"); });

// ── INIT ──────────────────────────────────────────
window.addEventListener("resize", setCanvasSize);
setCanvasSize();
renderList();
</script>
</body>
</html>
